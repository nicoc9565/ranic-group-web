name: Outreach — check replies
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Ver las notas del workflow de send-batch: host con www (el apex redirige y curl descarta
      # el Authorization al seguir el redirect) y --fail-with-body para que un 4xx o 5xx ponga el
      # job en rojo en vez de pasar desapercibido durante semanas. Ojo con el detalle que está
      # explicado allá: --fail no falla ante un 3xx, así que el chequeo anterior era ciego
      # justo al redirect que estaba ocurriendo.
      - name: POST /api/outreach/check-replies
        run: |
          curl -sS --fail-with-body \
            -w '\nHTTP %{http_code}\n' \
            -X POST https://www.ranicgroup.com/api/outreach/check-replies \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
